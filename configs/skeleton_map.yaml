# 训练骨架 → 目标 YSM 模型骨骼的映射表
#
# ⛔ 当前为空：需要一份目标 YSM 模型文件才能填。
#    填好后，导出阶段（阶段 5）才能把训练出的动作搬进 YSM。

target_model: null          # 例如 miku.ysm / 某个 YSM 模型标识
target_fps: 30              # YSM 动画目标帧率

# 左 = configs/skeleton.yaml 里的关节名
# 右 = 目标 YSM 模型里的骨骼名（null 表示丢弃该关节的动画）
mapping: {}
  # hips: Bip01
  # spine: Spine
  # head: Head
  # leftArm: Arm_L
  # ...

# 导出时可选项
export:
  keyframe_reduction: true   # 抽稀关键帧，避免文件过大
  euler_order: XYZ           # 若 YSM 用欧拉角，需确认顺序
  rotation_unit: degree      # degree / radian，待确认
