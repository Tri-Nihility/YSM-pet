name: Build YSM-pet (Windows)

# 推 tag 就出一版 Release；也可以 Actions 页面手动触发
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# 控制台编码：windows runner 默认 cp1252，装不下中文。桌宠的提示信息全是中文
# （spec 的收尾日志、run_pet 的加载进度都是），不设会直接 UnicodeEncodeError。
# 注意 PYTHONUTF8 只在解释器启动前生效，所以在这里设环境变量；
# 运行时脚本内部另有 sys.stdout.reconfigure 兜底（防止用户在非中文 Windows 上崩）。
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 版本号
        id: ver
        shell: bash
        run: |
          v=$(tr -d '\r\n' < VERSION)
          echo "ver=$v" >> "$GITHUB_OUTPUT"
          echo "版本号: $v"

      # native/*.dll 已静态链接（只依赖 KERNEL32 + msvcrt），可以在任意
      # Windows 上直接复用，不需要在 CI 里装 MinGW 重编。
      # 缺了也不会崩：FastRenderer 会自动退化成纯 Python 渲染。
      - name: 确认原生 DLL 就位
        shell: bash
        run: |
          for f in raster ysmcrypt ysmreader; do
            test -f native/$f.dll && echo "  ✓ native/$f.dll" \
              || echo "  ⚠️ 缺 native/$f.dll（会退化成纯 Python 渲染）"
          done

      - name: PyInstaller 打包
        run: python -m PyInstaller YSM-pet.spec --noconfirm --clean

      # v0.3.2 起是 onefile 单文件：产物就是 dist/YSM-pet.exe 一个文件
      #（依赖全在 exe 里，启动时解压到 %TEMP%/_MEIxxxx）。
      - name: 校验产物完整性
        shell: bash
        run: |
          set -e
          test -f dist/YSM-pet.exe || { echo "exe 没生成"; exit 1; }
          ls -lh dist/YSM-pet.exe
          echo "产物 OK（onefile 单文件）"

      # 有没有模型都得能启动：--help 会走完 argparse，能验证打包出来的
      # Python 运行时 + 依赖打包完整（漏东西在这里就崩了，不会拖到 Release）。
      # --self-check 更进一步：把函数内 import 的关键模块（zstandard 等）
      # 全部真 import 一遍 —— v0.3.0 就是漏了 zstandard，--help 冒烟碰不到
      # 那条路径，用户一加载加密模型才崩。
      # ⚠️ windowed 打包（console=False）没有控制台，stdout 直接丢弃，
      #    所以每个模式都带 --out 把输出落日志文件，再读日志校验。
      - name: 冒烟（ --help + --self-check ）
        shell: bash
        run: |
          set -e
          ./dist/YSM-pet.exe --help --out help.log
          grep -q "usage: YSM-pet.exe" help.log || { echo "--help 输出异常："; cat help.log; exit 1; }
          cat help.log
          ./dist/YSM-pet.exe --self-check --out selfcheck.log
          grep -q "自检通过" selfcheck.log || { echo "自检未通过："; cat selfcheck.log; exit 1; }
          cat selfcheck.log

      - name: 压缩 Release 包
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $zip = "out/YSM-pet-${{ steps.ver.outputs.ver }}-win64.zip"
          Compress-Archive -Path "dist/YSM-pet.exe" -DestinationPath $zip
          Get-Item $zip | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      # 发布包纯度：onefile 之后 zip 里只允许有一个 YSM-pet.exe，
      # 打包过程产物（build/、日志、.spec、__pycache__…）一律不许进去。
      # zstandard 是否进包由上面的 --self-check 真 import 保证（onefile 的
      # 内容在 exe 里的 CArchive，没法像 onedir 那样列 _internal 清单）。
      - name: 校验发布包只含程序本体
        shell: bash
        run: |
          python - <<'PYEOF'
          import sys, zipfile
          z = zipfile.ZipFile("out/YSM-pet-${{ steps.ver.outputs.ver }}-win64.zip")
          names = z.namelist()
          tops = sorted(set(n.split('/')[0] for n in names if n.split('/')[0]))
          allowed = {'YSM-pet.exe'}
          extra = [t for t in tops if t not in allowed]
          missing = [t for t in allowed if t not in tops]
          bad = [n for n in names if '__pycache__' in n or n.endswith(('.pdb', '.log', '.spec'))]
          print('zip 条目数:', len(names), '顶层:', tops)
          if extra:
              print('✗ 发布包混入非程序内容:', extra); sys.exit(1)
          if missing:
              print('✗ 发布包缺程序本体:', missing); sys.exit(1)
          if bad:
              print('✗ 发布包混入打包过程产物:', bad[:5]); sys.exit(1)
          size = z.getinfo('YSM-pet.exe').file_size
          print('exe 解压后大小: %.1f MB' % (size / 1048576))
          if size < 50 * 1048576:
              print('✗ exe 太小（<50MB），依赖没打全'); sys.exit(1)
          print('发布包纯度 OK：单文件 exe，zstandard 由 --self-check 把关')
          PYEOF

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: YSM-pet-win64
          path: out/*.zip
          if-no-files-found: error

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
          name: "YSM-pet ${{ steps.ver.outputs.ver }}"
          generate_release_notes: true
